name: Release

# Push a tag like v0.3.2 and this builds a signed APK and publishes it as a GitHub
# Release. The in-app updater checks this same "latest release" and installs the APK.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     - your release keystore, base64-encoded
#                         (base64 -w0 release.keystore  — or on Windows:
#                          certutil -encodehex release.keystore out.b64 0x40000001)
#   KEYSTORE_PASSWORD   - the keystore (store) password
#   KEY_ALIAS           - the key alias inside the keystore
#   KEY_PASSWORD        - the key password
#
# IMPORTANT: this must be the SAME key that signed the LiquidTube already installed on
# people's phones. Android refuses to install an update signed with a different key.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version from the tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          GRADLE_VER=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Tag version: $TAG — gradle versionName: $GRADLE_VER"
          if [ "$TAG" != "$GRADLE_VER" ]; then
            echo "::error::Tag v$TAG does not match versionName \"$GRADLE_VER\" in app/build.gradle.kts. Bump versionName (and versionCode) to match the tag."
            exit 1
          fi

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set. Add your release keystore and passwords as repository secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          cat > "$RUNNER_TEMP/keystore.properties" <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed release APK
        env:
          LIQUIDTUBE_KEYSTORE: ${{ runner.temp }}/keystore.properties
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LiquidTube-${{ steps.ver.outputs.version }}.apk"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LiquidTube ${{ steps.ver.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/LiquidTube-${{ steps.ver.outputs.version }}.apk
